name: Desktop builds

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      version_tag: ${{ steps.project_version.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: project_version
        shell: pwsh
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not read project version from pyproject.toml" }
          "tag=v$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          "filename=autocollage-$($match.Matches[0].Groups[1].Value).exe" >> $env:GITHUB_OUTPUT

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra desktop --group build

      - name: Verify Collage processing and server
        run: uv run --locked python test_collage.py

      - name: Build Collage.exe
        run: uv run --locked --extra desktop --group build pyinstaller --clean --noconfirm --onefile --windowed --name Collage --add-data "index.html;." --collect-all imageio_ffmpeg --collect-all pillow_heif --exclude-module PIL._imagingft desktop.py

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $smokeLog = Join-Path $env:RUNNER_TEMP "Collage-smoke.log"
          $webviewLog = Join-Path $env:RUNNER_TEMP "Collage-webview.log"
          $env:COLLAGE_SMOKE_LOG = $smokeLog
          $env:COLLAGE_WEBVIEW_LOG = $webviewLog
          $smoke = Start-Process -FilePath ".\dist\Collage.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $smoke.WaitForExit(90000)) {
            $smoke.Kill($true)
            $smoke.WaitForExit()
            if (Test-Path $webviewLog) { Get-Content $webviewLog }
            if (Test-Path $smokeLog) { Get-Content $smokeLog }
            throw "Packaged desktop smoke test timed out after 90 seconds"
          }
          if (Test-Path $webviewLog) { Get-Content $webviewLog }
          if (Test-Path $smokeLog) { Get-Content $smokeLog }
          if ($smoke.ExitCode -ne 0) { throw "Packaged desktop smoke test failed with exit code $($smoke.ExitCode)" }

      - name: Name versioned Windows download
        shell: pwsh
        run: Move-Item -LiteralPath dist/Collage.exe -Destination "dist/${{ steps.project_version.outputs.filename }}"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Collage-Windows
          path: dist/autocollage-*.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
            slug: apple-silicon
          - runner: macos-15-intel
            arch: Intel
            slug: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra desktop --group build

      - name: Verify processing and server
        run: uv run --locked python test_collage.py

      - name: Build Collage.app
        run: uv run --locked --extra desktop --group build pyinstaller --clean --noconfirm --onedir --windowed --name Collage --osx-bundle-identifier com.diafanous.collage --add-data "index.html:." --collect-all imageio_ffmpeg --collect-all pillow_heif --exclude-module PIL._imagingft desktop.py

      - name: Smoke-test packaged Mac app
        env:
          COLLAGE_SMOKE_LOG: ${{ runner.temp }}/Collage-smoke.log
          COLLAGE_WEBVIEW_LOG: ${{ runner.temp }}/Collage-webview.log
        run: |
          uv run --locked python - <<'PY'
          import os, subprocess
          from pathlib import Path
          try:
              subprocess.run(['dist/Collage.app/Contents/MacOS/Collage','--smoke-test'],timeout=120,check=True)
          finally:
              for name in ('COLLAGE_SMOKE_LOG','COLLAGE_WEBVIEW_LOG'):
                  log = Path(os.environ[name])
                  if log.exists():
                      print(log.read_text())
          PY

      - name: Package Mac app
        run: |
          VERSION=$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ditto -c -k --sequesterRsrc --keepParent dist/Collage.app "dist/autocollage-${VERSION}-macos-${{ matrix.slug }}.zip"

      - name: Upload Mac app
        uses: actions/upload-artifact@v4
        with:
          name: Collage-macOS-${{ matrix.arch }}
          path: dist/autocollage-*-macos-${{ matrix.slug }}.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: Collage-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || needs.build.outputs.version_tag }}
          REPOSITORY: ${{ github.repository }}
          IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            if [ "$IS_MAIN_PUSH" = "true" ]; then
              echo "Release $TAG_NAME already exists; leaving it unchanged."
            else
              gh release upload "$TAG_NAME" dist/autocollage-*.exe dist/autocollage-*-macos-*.zip --repo "$REPOSITORY" --clobber
            fi
          else
            gh release create "$TAG_NAME" dist/autocollage-*.exe dist/autocollage-*-macos-*.zip --repo "$REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "Collage $TAG_NAME"
          fi
