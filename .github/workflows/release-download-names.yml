name: Name current release downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-download-names.yml']

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rename assets without replacing their contents
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tomllib
          version = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          repo = os.environ['REPOSITORY']
          release = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v{version}']))
          names = {
              'Collage.exe': f'autocollage-{version}.exe',
              'Collage-macOS-AppleSilicon.zip': f'autocollage-{version}-macos-apple-silicon.zip',
              'Collage-macOS-Intel.zip': f'autocollage-{version}-macos-intel.zip',
          }
          for asset in release['assets']:
              new_name = names.get(asset['name'])
              if new_name:
                  subprocess.run(['gh','api','--method','PATCH',f"repos/{repo}/releases/assets/{asset['id']}",'-f',f'name={new_name}'],check=True,stdout=subprocess.DEVNULL)
                  print(f"{asset['name']} -> {new_name}")
          PY
